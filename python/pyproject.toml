[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-smi"
version = "1.3.0"
description = "Friendly Python wrapper for gpu-smi (AMD GPU reporting): objects for beginners, raw JSON + serve client for power users"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["gpu", "amd", "smi", "monitoring", "prometheus"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
]
dependencies = []  # stdlib only: subprocess, json, urllib, dataclasses

[project.urls]
Homepage = "https://github.com/Thenukegun10x/GPU-SMI"
Releases = "https://github.com/Thenukegun10x/GPU-SMI/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["gpu_smi*"]

# Release CI may drop prebuilt binaries here; wheels then work out of the box.
# (Never commit binaries to git — see ../.gitignore.)
[tool.setuptools.package-data]
gpu_smi = ["bin/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
